<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap&subset=vietnamese" rel="stylesheet">
<title>Devlin Phu English Everyday</title>
<style>
:root{--bg:#f4f6ff;--card:#fff;--tx:#1d2140;--mu:#6b7194;--ac:#5b5bf0;--ac2:#8b5cf6;--acx:#fff;--ok:#12805c;--bad:#c4321f;--bd:#e4e7f5;--warm:#fff4e0;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10121f;--card:#1b1f36;--tx:#eef0ff;--mu:#9aa1c8;--ac:#8c8cff;--ac2:#a78bfa;--acx:#10122a;--ok:#4cd2a0;--bad:#ff8a77;--bd:#2c3253;--warm:#3a2f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10121f;--card:#1b1f36;--tx:#eef0ff;--mu:#9aa1c8;--ac:#8c8cff;--ac2:#a78bfa;--acx:#10122a;--ok:#4cd2a0;--bad:#ff8a77;--bd:#2c3253;--warm:#3a2f1c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Roboto","Segoe UI",system-ui,-apple-system,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 34px;border-radius:0 0 26px 26px}
.hw{max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:flex-start;gap:12px}.hb{display:flex;gap:8px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;line-height:1.15}.logo small{display:block;font-weight:600;font-size:12px;opacity:.85;letter-spacing:.5px}
.streak{background:rgba(255,255,255,.22);padding:7px 14px;border-radius:99px;font-weight:800;white-space:nowrap;font-size:15px;line-height:1.3}
main{max-width:640px;margin:-18px auto 0;padding:0 14px;position:relative}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(70,70,160,.07)}
h2{font-size:19px;margin:6px 2px 10px}h3{margin:0 0 6px}
.mu,.hint{color:var(--mu);font-size:14px}
.banner{background:var(--warm);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0 4px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{padding:7px 13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.flash{min-height:210px;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;user-select:none;position:relative}
.big{font-size:34px;font-weight:800}.vi{font-size:24px;font-weight:800;color:var(--ac)}.ex{color:var(--mu);font-size:15px}
.star{position:absolute;top:10px;right:12px;font-size:26px;background:none;border:0;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;min-width:90px}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.les table{width:100%;border-collapse:collapse;font-size:15px}.les td{padding:5px 6px;border-bottom:1px solid var(--bd);vertical-align:top}
.formula{background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:9px 12px;margin:8px 0;font-weight:700}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.bm{background:none;border:1px solid var(--bd);border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--tx);font:inherit;font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.tile{position:relative;overflow:hidden;text-align:left;padding:12px 12px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}.tile b{font-size:14px;line-height:1.3}.tile span{font-size:12px;color:var(--mu)}.tile i{position:absolute;left:0;bottom:0;height:4px;background:var(--ok)}.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.fb{margin-top:8px;font-size:15px}
.sv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.sv:last-child{border:0}
.dots{display:flex;gap:6px;margin-top:8px}.dots span{flex:1;text-align:center;font-size:12px;padding:6px 0;border-radius:8px;background:var(--bd);color:var(--mu)}.dots span.d{background:var(--ok);color:#fff}
input[type=time]{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:120px;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:700;padding:6px 2px;border-radius:12px;cursor:pointer}
nav button b{display:block;font-size:21px;line-height:1.2}nav button.on{color:var(--ac);background:var(--bg)}
textarea,.ci{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);resize:vertical}

.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.bub{max-width:88%;padding:11px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--card);border:1px solid var(--bd);border-bottom-left-radius:4px}
.tip{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--warm);font-size:14px}
.cin{display:flex;gap:8px;align-items:center}
.cin .btn{flex:none;min-width:0;padding:12px 16px}
html{-webkit-text-size-adjust:100%}*{-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;touch-action:manipulation}
.btn,.opt,.chip,.tile{min-height:46px}.bm{min-height:40px;min-width:44px}
input,select,textarea,.ci{font-size:16px}
.big{font-size:clamp(26px,8.5vw,34px)}.vi{font-size:clamp(20px,6.5vw,24px)}
.sv>div:first-child{min-width:0;word-break:break-word}
details.tp{border:1px solid var(--bd);border-radius:14px;background:var(--card);margin-bottom:8px;overflow:hidden}
details.tp>summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}
details.tp>summary::-webkit-details-marker{display:none}
details.tp>summary::after{content:"▾";color:var(--mu)}details.tp[open]>summary::after{content:"▴"}
details.tp .sv{padding:8px 14px}
@media (max-width:420px){main{padding:0 10px}.card{padding:14px;border-radius:16px}header{padding-bottom:30px}.logo{font-size:18px}nav button{font-size:10px;padding:5px 1px}nav button b{font-size:20px}.grid{gap:6px}.tile{padding:11px 10px 14px}.row{gap:6px}.btn{padding:12px 8px;min-width:80px}h2{font-size:17px}}
</style>
</head>

<main><div id="view"></div></main>

c tiêu của tôi. Nó giống như sáng tạo nghệ thuật với thiên nhiên"],["Yes, I love swimming in the ocean.","Vâng, tôi thích bơi lội ở biển"],["Not really, I prefer relaxing on the shore.","Không hẳn, tôi thích thư giãn trên bờ hơn"],["Well, we can have a picnic or simply relax on the sand.","Chà, chúng ta có thể đi dã ngoại hoặc đơn giản là thư giãn trên bãi cát"],["Building sandcastles and flying kites are also fun activities I would recommend.","Xây lâu đài cát và thả diều cũng là những hoạt động thú vị mà tôi gợi ý"],["Yes, I find it fascinating to collect seashells.","Vâng, tôi thấy thú vị khi sưu tập vỏ sò"],["No, I'm not really into it.","Không, tôi không thực sự thích nó"],["It's not really my thing, but I do appreciate the beauty of seashells.","Đó không thực sự là sở thích của tôi, nhưng tôi đánh giá cao vẻ đẹp của vỏ sò"],["What is your favorite thing about the beach?","Điều yêu thích của bạn về bãi biển là gì?"],["I love the sound of the waves crashing.","Tôi yêu âm thanh của sóng vỗ"],["The feeling of the warm sand beneath my feet is my favorite.","Cảm giác cát ấm áp dưới chân là điều tôi thích nhất"],["Well, I enjoy the cool breeze and the fresh ocean air.","Chà, tôi tận hưởng làn gió mát và không khí biển trong lành"],["Do you prefer sunbathing or playing games at the beach?","Bạn thích tắm nắng hay chơi trò chơi ở bãi biển?"],["I prefer sunbathing and relaxing.","Tôi thích tắm nắng và thư giãn hơn"],["I'm more into playing games like beach volleyball or frisbee with friends.","Tôi thích chơi các trò chơi như bóng chuyền bãi biển hoặc ném đĩa với bạn bè hơn"],["What food or snacks do you like to bring to the beach?","Bạn thích mang đồ ăn hay đồ ăn nhẹ nào khi đi biển?"],["I usually bring sandwiches, fruits, and some chips.","Tôi thường mang theo bánh mì, trái cây và một ít khoai tây chiên"],["Nothing beats having a cold slice of watermelon at the beach.","Không gì tuyệt vời hơn việc thưởng thức một lát dưa hấu lạnh trên bãi biển"],["Yes, my favorite beach is…, it's my little paradise.","Vâng, bãi biển yêu thích của tôi là…, đó là thiên đường nhỏ của tôi"],["No, I enjoy exploring new beaches because each one has its charm and beauty.","Không, tôi thích khám phá những bãi biển mới vì mỗi bãi biển đều có nét quyến rũ và vẻ đẹp riêng"],["Having fun with friends or family.","Vui vẻ với bạn bè hoặc gia đình"],["Finding a quiet spot and relaxing with a good book is perfect for me.","Tìm một nơi yên tĩnh và thư giãn với một cuốn sách hay là điều hoàn hảo đối với tôi"],["Could you keep an eye on my stuff for a few minutes?","Bạn có thể để mắt đến đồ đạc của tôi trong vài phút được không?"],["Could I leave my bag with you for a few minutes?","Tôi có thể để túi của tôi với bạn trong vài phút được không?"]],"Quê hương":[["Where is your hometown located?","Quê hương của bạn nằm ở đâu?"],["My hometown is located in…","Quê hương tôi nằm ở…"],["It's situated in the north/south of Viet Nam.","Nó nằm ở phía bắc / phía nam của Việt Nam"],["Is your hometown big or small?","Quê hương của bạn lớn hay nhỏ?"],["It's a small town.","Đó là một thị trấn nhỏ"],["My hometown is quite large.","Quê hương tôi khá rộng lớn"],["It's a medium-sized city.","Đó là một thành phố cỡ trung bình"],["How is the atmosphere there?","Không khí ở đó thế nào?"],["The atmosphere is really nice and friendly.","Bầu không khí thực sự tốt đẹp và thân thiện"],["Well, it’s quite peaceful. I enjoy the fresh air.","Chà, nó khá yên bình. Tôi tận hưởng không khí trong lành"],["Everyone is very nice.","Mọi người đều rất tốt"],["Do you like your hometown?","Bạn có yêu quê không?"],["Yes, I really like my hometown.","Vâng, tôi rất thích quê hương của mình"],["I have mixed feelings about my hometown.","Tôi có cảm xúc lẫn lộn về quê hương của mình"],["I love my hometown; it's a great place.","Tôi yêu quê hương tôi; đó là một nơi tuyệt vời"],["What do you like most about your hometown?","Bạn thích điều gì nhất ở quê hương của bạn?"],["I love the friendly atmosphere in my hometown.","Tôi yêu bầu không khí thân thiện ở quê hương tôi"],["Natural beauty is what I like most.","Vẻ đẹp tự nhiên là điều tôi thích nhất"],["There are many cultural attractions that I enjoy.","Có rất nhiều điểm tham quan văn hóa mà tôi thích"],["Are there any parks or natural areas in your hometown?","Có công viên hoặc khu vực thiên nhiên nào ở quê hương của bạn không?"],["Yes, there are several parks with beautiful landscapes.","Vâng, có một số công viên có phong cảnh đẹp"],["We have a few natural reserves and hiking trails.","Chúng tôi có một vài khu bảo tồn thiên nhiên và những con đường mòn đi bộ đường dài"],["Are there any famous places in your hometown?","Có địa điểm nào nổi tiếng ở quê hương của bạn không?"],["Yes, we have a historic landmark called…","Vâng, chúng tôi có một địa danh lịch sử tên là…"],["There's a well-known museum/art gallery here.","Có một bảo tàng/phòng trưng bày nghệ thuật nổi tiếng ở đây"],["One of the famous places is…","Một trong những địa điểm nổi tiếng là…"],["Do you have many friends in your hometown?","Bạn có nhiều bạn bè ở quê không?"],["Yes, I have quite a few friends here.","Vâng, tôi có khá nhiều bạn bè ở đây"],["I have a small circle of close friends.","Tôi có một nhóm nhỏ bạn bè thân thiết"],["I have many acquaintances but a few close friends.","Tôi có nhiều người quen nhưng chỉ có một vài người bạn thân"]],"Lễ hội Việt Nam":[["Have you ever been to a festival in Vietnam?","Bạn đã từng tham dự một lễ hội nào ở Việt Nam chưa?"],["What is your favorite festival in Vietnam and why?","Lễ hội yêu thích của bạn ở Việt Nam là gì và tại sao?"],["I enjoy the Lantern Festival during the Mid-Autumn Festival; the colorful lanterns are mesmerizing.","Tôi thích Lễ hội đèn lồng vào dịp Trung thu; những chiếc đèn lồng đầy màu sắc thật mê hoặc"],["Do you like attending festivals in Vietnam?","Bạn có thích tham dự các lễ hội ở Việt Nam không?"],["Yes, Vietnamese festivals are so full of culture and traditions; it's a wonderful experience.","Vâng, lễ hội Việt Nam mang đậm nét văn hóa, truyền thống; đó là một trải nghiệm tuyệt vời"],["What do you enjoy the most at Vietnamese festivals?","Bạn thích điều gì nhất ở các lễ hội Việt Nam?"],["Which festival food in Vietnam do you like the most?","Bạn thích món ăn lễ hội nào nhất ở Việt Nam?"],["Do you enjoy the music or performances at Vietnamese festivals?","Bạn có thích âm nhạc hoặc biểu diễn tại các lễ hội Việt Nam không?"],["Yes, I adore the traditional music and folk dances; they are so lively and engaging.","Vâng, tôi yêu thích âm nhạc truyền thống và các điệu múa dân gian; chúng rất sống động và hấp dẫn"],["The water puppet performances during festivals are unique and fascinating to watch.","Các màn trình diễn múa rối nước trong lễ hội rất độc đáo và hấp dẫn để thưởng thức"],["What makes Vietnamese festivals special for you?","Lễ hội Việt Nam có gì đặc biệt đối với bạn?"],["I find the blend of tradition and modern celebrations in Vietnamese festivals incredibly unique.","Tôi nhận thấy sự hòa quyện giữa lễ hội truyền thống và hiện đại trong các lễ hội của người Việt vô cùng độc đáo"],["Is there any festival tradition in Vietnam you find fascinating?","Có truyền thống lễ hội nào ở Việt Nam mà bạn thấy hấp dẫn không?"],["The practice of releasing lanterns into the sky during the Full Moon Festival is magical.","Tục thả đèn lồng lên trời trong dịp Tết Trung Thu thật kỳ diệu"],["How do you usually dress up for Vietnamese festivals?","Bạn thường ăn mặc như thế nào trong các lễ hội Việt Nam?"],["For most festivals, I dress comfortably but sometimes add traditional accessories.","Đối với hầu hết các lễ hội, tôi ăn mặc thoải mái nhưng đôi khi thêm phụ kiện truyền thống"],["Are there any unique festivals celebrated in Vietnam?","Có lễ hội độc đáo nào được tổ chức ở Việt Nam không?"]],"Động vật":[["What is your favorite animal?","Động vật yêu thích của bạn là gì?"],["My favorite animal is a dog because they are friendly.","Con vật tôi yêu thích nhất là chó vì chúng rất thân thiện"],["I really like dolphins because they are smart and graceful.","Tôi rất thích cá heo vì chúng thông minh và duyên dáng"],["I adore pandas because they are cute and cuddly.","Tôi yêu mến gấu trúc vì chúng dễ thương và đáng yêu"],["Have you ever had a pet?","Bạn đã từng nuôi thú cưng chưa?"],["Yes, I had a pet cat named… She was fluffy and loved to cuddle.","Vâng, tôi có một con mèo cưng tên là… Nó rất mềm mại và thích được âu yếm"],["I had a pet goldfish. Taking care of it was fun!","Tôi đã có một con cá vàng cưng. Chăm sóc nó thật là vui!"],["No, I never had a pet, but I really want a puppy someday.","Không, tôi chưa bao giờ nuôi thú cưng, nhưng một ngày nào đó tôi thực sự muốn có một chú chó con"],["Have you ever visited a zoo? What animals did you see there?","Bạn đã bao giờ đến thăm sở thú chưa? Bạn đã nhìn thấy những con vật nào ở đó?"],["Yes, I went to the zoo and saw lions, elephants, giraffes, and monkeys.","Vâng, tôi đã đến sở thú và nhìn thấy sư tử, voi, hươu cao cổ và khỉ"],["No, I haven't been because I'm a bit scared of some animals.","Không, tôi chưa từng đến vì tôi hơi sợ một số loài động vật"],["No, I haven't been to a zoo yet.","Chưa, tôi chưa đến sở thú"],["Do you have a favorite animal from a story or movie?","Bạn có con vật yêu thích nào trong truyện hoặc phim không?"],["My favorite animal is Simba from The Lion King because he's brave.","Con vật tôi yêu thích nhất là Simba trong phim Vua sư tử vì chú ấy rất dũng cảm"],["I love Dory from Finding Nemo because she's funny.","Tôi yêu thích Dory trong Đi tìm Nemo vì cô ấy vui tính"]],"Giải trí":[["What is your favorite movie or TV show?","Bộ phim hoặc chương trình truyền hình yêu thích của bạn là gì?"],["I love Moana because she's adventurous and the songs are so catchy!","Tôi yêu Moana vì cô ấy thích phiêu lưu và các bài hát rất hấp dẫn!"],["Peppa Pig is my favorite show because it's funny.","Peppa Pig là chương trình tôi yêu thích nhất vì nó hài hước"],["Do you enjoy playing any games?","Bạn có thích chơi trò chơi nào không?"],["I enjoy playing Minecraft. I love building and creating new things in the game.","Tôi thích chơi Minecraft. Tôi thích xây dựng và sáng tạo những thứ mới trong trò chơi"],["Yes. Hide-and-seek is my favorite game.","Có chứ. Trốn tìm là trò chơi yêu thích của tôi"],["No, I don't really play games. I prefer reading books.","Không, tôi thực sự không chơi game. Tôi thích đọc sách hơn"],["Have you been to the movies? What movie did you watch?","Bạn đã đi xem phim chưa? Bộ phim bạn đã xem là gì?"],["Yeah, I saw Toy Story 4! Woody and Buzz are awesome and funny!","Vâng, tôi đã xem Toy Story 4! Woody và Buzz thật tuyệt vời và hài hước!"],["Yes, I went to see Frozen. I loved the songs and Elsa's magical powers!","Vâng, tôi đã đi xem phim Frozen. Tôi yêu các bài hát và sức mạnh kỳ diệu của Elsa!"],["No, I haven’t been to the movies yet.","Không, tôi chưa đi xem phim bao giờ"],["What kinds of music do you like listening to?","Bạn thích nghe loại nhạc nào?"],["I enjoy listening to pop music because it's catchy and makes me want to dance.","Tôi thích nghe nhạc pop vì nó hấp dẫn và khiến tôi muốn nhảy"],["I like listening to classical music because it's so peaceful and helps me relax.","Tôi thích nghe nhạc cổ điển vì nó rất yên bình và giúp tôi thư giãn"],["What do you like to do for fun with your friends or family?","Bạn thích làm gì để giải trí cùng bạn bè hoặc gia đình?"],["I enjoy playing soccer with my friends at the park.","Tôi thích chơi bóng đá với bạn bè ở công viên"],["Family game nights are the best. We play Uno and laugh a lot together!","Đêm trò chơi gia đình là tuyệt nhất. Chúng tôi chơi Uno và cùng nhau cười rất nhiều!"],["Do you have a favorite character from a movie or show?","Bạn có nhân vật yêu thích trong một bộ phim hoặc chương trình nào không?"],["I really like Iron Man because he's super smart.","Tôi thực sự thích Iron Man vì anh ấy siêu thông minh"],["Spider-Man is my favorite superhero. He climbs walls and saves hoại là gì?"],["My favorite app is Instagram.","Ứng dụng yêu thích của tôi là Instagram"],["I really like using the YouTube app.","Tôi thực sự thích sử dụng ứng dụng YouTube"],["Do you have a computer or laptop?","Bạn có máy tính hoặc máy tính xách tay không?"],["Yes, I have a laptop for work and entertainment.","Vâng, tôi có một chiếc máy tính xách tay để làm việc và giải trí"],["No, I don't own a computer, but I use the computers at the library.","Không, tôi không có máy tính nhưng tôi sử dụng máy tính ở thư viện"],["What do you use the internet for?","Bạn dùng mạng để làm gì?"],["I use the internet for social media and watching videos.","Tôi sử dụng Internet để truy cập mạng xã hội và xem video"],["I use it for online shopping and researching information.","Tôi sử dụng nó để mua sắm trực tuyến và nghiên cứu thông tin"],["Have you ever played video games?","Bạn đã bao giờ chơi trò chơi điện tử chưa?"],["Yes, I enjoy playing video games. My favorite is Minecraft.","Có, tôi thích chơi trò chơi điện tử. Yêu thích của tôi là Minecraft"],["No, I'm not really interested in video games.","Không, tôi không thực sự hứng thú với trò chơi điện tử"],["Do you like taking photos with your phone?","Bạn có thích chụp ảnh bằng điện thoại không?"],["Yes, I love taking photos, especially when I travel.","Vâng, tôi thích chụp ảnh, đặc biệt là khi đi du lịch"],["No, I don't take many photos. I prefer to enjoy the moment.","Không, tôi không chụp nhiều ảnh. Tôi thích tận hưởng khoảnh khắc hiện tại hơn"],["What is your favorite gadget?","Tiện ích yêu thích của bạn là gì?"],["My favorite gadget is my smartwatch; it helps me stay organized.","Tiện ích yêu thích của tôi là đồng hồ thông minh; nó giúp tôi luôn ngăn nắp"],["I really like my Bluetooth headphones for listening to music.","Tôi thực sự thích tai nghe Bluetooth của mình để nghe nhạc"],["Do you watch TV shows or movies online?","Bạn có xem chương trình truyền hình hoặc phim trực tuyến không?"],["Yes, I watch Netflix on my computer.","Có, tôi xem Netflix trên máy tính"],["No, I prefer watching TV shows on traditional television.","Không, tôi thích xem chương trình truyền hình trên truyền hình truyền thống hơn"],["Have you ever attended an online class or webinar?","Bạn đã bao giờ tham dự một lớp học trực tuyến hoặc hội thảo trên web chưa?"],["Yes, I regularly attend online classes for learning new skills.","Có, tôi thường xuyên tham gia các lớp học trực tuyến để học các kỹ năng mới"],["No, I prefer traditional in-person classes.","Không, tôi thích các lớp học trực tiếp truyền thống hơn"],["I tried it once, but I didn't find it effective for me.","Tôi đã thử nó một lần, nhưng tôi không thấy nó hiệu quả với tôi"],["Do you use social media?","Bạn có sử dụng mạng xã hội không?"],["Yes, I'm active on Facebook, Instagram, and Twitter.","Có, tôi đang hoạt động trên Facebook, Instagram và Twitter"],["No, I prefer to keep my life private.","Không, tôi thích giữ cuộc sống riêng tư hơn"],["I only use social media to connect with family.","Tôi chỉ sử dụng mạng xã hội để kết nối với gia đình"]]};

{t:"1. Động từ to be (am / is / are)",b:"<p>Dùng để nói “là, thì, ở”. Đây là nền tảng quan trọng nhất.</p><table><tr><td>I</td><td><b>am</b></td><td>I am a teacher.</td></tr><tr><td>He / She / It</td><td><b>is</b></td><td>She is tired.</td></tr><tr><td>You / We / They</td><td><b>are</b></td><td>They are at work.</td></tr></table><div class='formula'>Phủ định: thêm not → I am not busy.<br>Câu hỏi: đảo to be lên đầu → Are you busy?</div>"},
{t:"2. Hiện tại đơn (thói quen, sự thật)",b:"<p>Nói về việc làm thường xuyên hoặc điều luôn đúng.</p><div class='formula'>I / You / We / They + động từ<br>He / She / It + động từ<b>-s</b></div><p>I work every day. → She work<b>s</b> every day.</p><div class='formula'>Phủ định: do not (don’t) / does not (doesn’t) + động từ gốc<br>Hỏi: Do you work here? / Does he work here?</div><p>Lưu ý: sau does / doesn’t, động từ bỏ -s: He doesn’t work.</p>"},
{t:"3. Hiện tại tiếp diễn (đang làm)",b:"<p>Nói việc đang xảy ra ngay lúc này.</p><div class='formula'>am / is / are + động từ-<b>ing</b></div><p>I am working now.<br>She is eating lunch.<br>Are you listening?</p>"},
{t:"4. Quá khứ đơn (đã làm)",b:"<p>Nói việc đã xảy ra và kết thúc.</p><div class='formula'>Động từ thường + <b>ed</b>: work → worked, finish → finished</div><table><tr><td>go → <b>went</b></td><td>eat → <b>ate</b></td></tr><tr><td>have → <b>had</b></td><td>see → <b>saw</b></td></tr><tr><td>buy → <b>bought</b></td><td>do → <b>did</b></td></tr></table><div class='formula'>Phủ định: did not (didn’t) + động từ gốc → I didn’t go.<br>Hỏi: Did you go? → Yes, I did.</div>"},
{t:"5. Tương lai: will và going to",b:"<div class='formula'>will + động từ: quyết định tại chỗ, lời hứa<br>am/is/are going to + động từ: kế hoạch đã có</div><p>I will help you.<br>I am going to visit Da Nang next week.</p>"},
{t:"6. Can, want to, would like to, have to",b:"<table><tr><td><b>can</b> + V</td><td>có thể, biết làm. I can swim.</td></tr><tr><td><b>want to</b> + V</td><td>muốn. I want to learn English.</td></tr><tr><td><b>would like to</b> + V</td><td>muốn (lịch sự). I would like to order.</td></tr><tr><td><b>have to</b> + V</td><td>phải. I have to work today.</td></tr></table><p>Xin giúp lịch sự: <b>Could you</b> help me, please?</p>"},
{t:"7. There is / There are, câu hỏi Wh-",b:"<p><b>There is</b> + 1 vật: There is a bank near here.<br><b>There are</b> + nhiều vật: There are two rooms.</p><table><tr><td>What</td><td>cái gì</td><td>What do you do?</td></tr><tr><td>Where</td><td>ở đâu</td><td>Where do you live?</td></tr><tr><td>When</td><td>khi nào</td><td>When is the meeting?</td></tr><tr><td>Who</td><td>ai</td><td>Who is she?</td></tr><tr><td>Why</td><td>tại sao</td><td>Why are you late?</td></tr><tr><td>How</td><td>thế nào</td><td>How are you?</td></tr></table>"}
];

var t=q.ty==0?"Nghĩa của “"+q.w[0]+"” là gì?":q.ty==1?"Chọn từ tiếng Anh có nghĩa: “"+q.w[1]+"”":"🎧 Nghe và chọn từ bạn nghe được";
$("view").innerHTML="<div class='hint'>"+back+" Câu "+(LS.qi+1)+"/"+LS.qs.length+" · Điểm "+LS.score+"</div><div class='bar'><i style='width:"+LS.qi/LS.qs.length*100+"%'></i></div><div class='card'><div style='font-size:21px;font-weight:800;margin-bottom:8px'>"+t+"</div>"+(q.ty!=1?"<button class='bm' onclick='speak(LS.qs[LS.qi].w[0])'>🔊 Nghe</button>":"")+q.opts.map(function(o,i){return "<button class='opt' onclick='lsAns("+i+")'>"+o+"</button>"}).join("")+"<div class='fb' id='fb'></div></div>"}
function lsAns(i){if(LS.ans)return;LS.ans=true;done();var q=LS.qs[LS.qi],ci=q.opts.indexOf(q.ans),b=document.querySelectorAll(".opt");if(b[ci])b[ci].classList.add("ok");var ok=i==ci;if(ok)LS.score++;else if(b[i])b[i].classList.add("bad");
$("fb").innerHTML=(ok?"✅ Chính xác! ":"❌ Chưa đúng. ")+"<b>"+q.w[0]+"</b> = "+q.w[1]+"<div style='margin-top:10px'><button class='btn p' style='width:100%' onclick='LS.qi++;lsView()'>"+(LS.qi==LS.qs.length-1?"Xem kết quả":"Câu tiếp theo →")+"</button></div>"}
function lsResult(no){var n=LS.qs.length,pass=LS.score>=Math.ceil(n*.67),l=LS.l,L=lessons(),h="<div class='card' style='text-align:center'><div class='big'>"+LS.score+"/"+n+"</div>";
if(pass){var p=S.lp[l.id],st=LS.mode=="review"&&p?Math.min((p.st||0)+1,3):0;S.lp[l.id]={s:LS.score,st:st,due:addDays([1,3,7,14][st])};l.w.forEach(function(w){S.known[w[0]]=1});save();var nx=LS.i+1<L.length?LS.i+1:-1;LS.pend=nx>=0;var idc=l.id;if(nx>=0)setTimeout(function(){if(LS&&LS.pend&&LS.l.id==idc)startL(nx,"learn")},4000);
h+="<p>🎉 "+(LS.mode=="review"?"Ôn tập tốt!":"Hoàn thành bài "+no+"!")+" Hẹn ôn lại ngày "+S.lp[l.id].due+".</p>"+(nx>=0?"<div class='hint' id='cd'>Tự chuyển sang bài sau trong 4 giây…</div><button class='btn p' style='width:100%;margin-top:6px' onclick='startL("+nx+",\"learn\")'>Sang Bài "+(nx+1)+" ngay →</button><button class='btn' style='width:100%;margin-top:8px' onclick='LS.pend=false;$(\"cd\").textContent=\"Đã dừng tự chuyển.\"'>Ở lại bài này</button>":"<p>Bạn đã học hết các bài hiện có!</p>")}
else h+="<p>Chưa đạt, cần đúng ít nhất "+Math.ceil(n*.67)+"/"+n+". Đừng lo, học lại một lượt rồi thử nữa nhé 💪</p><button class='btn p' style='width:100%' onclick='LS.phase=\"learn\";lsView()'>Học lại bài</button><button class='btn' style='width:100%;margin-top:8px' onclick='mkQ();lsView()'>Làm lại phần ôn tập</button>";
$("view").innerHTML=h+"<button class='btn' style='width:100%;margin-top:8px' onclick='LS=null;lessonTab()'>Về lộ trình</button></div>"}
var PHL=[];Object.keys(PH).forEach(function(k){PH[k].forEach(function(p){PHL.push([k,p[0],p[1]])})});
var pt=Object.keys(PH)[0],pq="";
function phr(){
$("view").innerHTML="<select class='ci' style='margin-bottom:8px' onchange='pt=this.value;pq=\"\";phr()'>"+Object.keys(PH).map(function(k){return "<option value='"+k+"'"+(k==pt?" selected":"")+">"+k+" ("+PH[k].length+")</option>"}).join("")+"</select><input class='ci' style='margin-bottom:10px' placeholder='🔍 Tìm mẫu câu trong tất cả chủ đề…' value='"+esc(pq)+"' oninput='pq=this.value;pl()'><div id='pl'></div>";pl()}
function pl(){var q=pq.trim().toLowerCase(),L=[];PHL.forEach(function(p,i){if(q?(p[1].toLowerCase().indexOf(q)>=0||p[2].toLowerCase().indexOf(q)>=0):p[0]==pt)L.push(i)});
$("pl").innerHTML="<div class='card'>"+(L.length?L.slice(0,80).map(function(i){var p=PHL[i];return "<div class='sv'><div><b>"+esc(p[1])+"</b><div class='ex'>"+esc(p[2])+"</div></div><div class='row' style='flex:none;flex-wrap:nowrap'><button class='bm' onclick='speak(PHL["+i+"][1])'>🔊</button><button class='bm' onclick='tpp("+i+")'>"+(S.sp[p[1]]?"⭐":"☆")+"</button></div></div>"}).join(""):"<span class='mu'>Không tìm thấy.</span>")+(L.length>80?"<div class='hint'>Hiện 80 kết quả đầu, hãy gõ thêm để lọc.</div>":"")+"</div>"}
function tpp(i){var k=PHL[i][1];if(S.sp[k])delete S.sp[k];else{S.sp[k]=1;done()}save();if($("pl"))pl()}
render();setInterval(tick,30000);tick();
</script>
